[package]
name = "rivals-modfix"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
aes = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
oozextract = "0.4"

[profile.release]
opt-level = 2
strip = true
